# Build and push Docker images to ECR (use when local Docker is unavailable).
# GitHub → Actions → ECR Push → Run workflow
#
# Requires repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# Create keys for IAM user: github-actions-ecr (ECR push policy attached).

name: ECR Push

on:
  workflow_dispatch:
    inputs:
      backend_public_url:
        description: "Backend URL for frontend build (https://....awsapprunner.com)"
        required: false
        default: "https://p3jivcdmbf.us-east-2.awsapprunner.com"

permissions:
  contents: read

env:
  AWS_REGION: us-east-2

jobs:
  push:
    name: Build and push to ECR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Require AWS credentials
        run: |
          set -euo pipefail
          test -n "${{ secrets.AWS_ACCESS_KEY_ID }}" || {
            echo "::error::Missing repository secret AWS_ACCESS_KEY_ID."
            echo "Create an access key for IAM user github-actions-ecr and add it under Settings → Secrets and variables → Actions."
            exit 1
          }
          test -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" || {
            echo "::error::Missing repository secret AWS_SECRET_ACCESS_KEY."
            exit 1
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push backend (FLAN-T5)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          no-cache: true
          platforms: linux/amd64
          build-args: |
            INSTALL_AI=true
            PREFETCH_MODEL=true
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.ecr.outputs.registry }}/cloudmlops-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64
          build-args: |
            VITE_API_BASE_URL=${{ inputs.backend_public_url }}
          tags: ${{ steps.ecr.outputs.registry }}/cloudmlops-frontend:latest
