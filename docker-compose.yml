# =============================================================================
# CloudMLOps - full local stack
#
#   docker compose up --build
#
#   Frontend  http://localhost:5173
#   API docs  http://localhost:8000/docs
#   Postgres  localhost:5432
#
# The first backend start downloads the FLAN-T5 weights (~300 MB) into the
# hf-cache volume; later starts reuse it.
# =============================================================================

name: cloudmlops

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudmlops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudmlops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudmlops}
      POSTGRES_DB: ${POSTGRES_DB:-cloudmlops}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # database/schema.sql is deliberately NOT mounted as an init script.
      # Alembic owns the schema; letting both create tables gave two sources of
      # truth that silently drifted apart.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cloudmlops} -d ${POSTGRES_DB:-cloudmlops}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      args:
        INSTALL_AI: ${INSTALL_AI:-true}
    container_name: cloudmlops-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cloudmlops}:${POSTGRES_PASSWORD:-cloudmlops}@postgres:5432/${POSTGRES_DB:-cloudmlops}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-secret-change-me-please}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_JSON: ${LOG_JSON:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AI_BACKEND: ${AI_BACKEND:-auto}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-google/flan-t5-small}
      RUN_MIGRATIONS: 'true'
      AUTO_CREATE_SCHEMA: 'false'
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SEED_ADMIN: 'true'
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cloudmlops.app}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
    ports:
      - '8000:8000'
    volumes:
      - uploads:/app/storage
      - hf-cache:/home/app/.cache/huggingface

  frontend:
    build:
      context: ./frontend
      args:
        # Empty means same-origin: nginx proxies /api to the backend service.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: cloudmlops-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  postgres-data:
  uploads:
  hf-cache:
